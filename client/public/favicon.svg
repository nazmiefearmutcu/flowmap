<!-- FlowMap favicon — the script F from the app icon, on the candle-field tile.
     The letterform is Great Vibes (SIL OFL) converted to outlines, so the mark
     never depends on the font being installed.
     The candles sit at reduced opacity behind a dark scrim: at 16 px a full
     strength field turns into green noise and the F stops reading, which is the
     one size a browser tab actually uses. -->
