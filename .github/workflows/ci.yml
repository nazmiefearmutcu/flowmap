name: CI

# Fast push/PR gate: client typecheck + unit tests, server pytest.
# The heavier release/packaging pipeline lives in release.yml; the original
# combined suite job (uv-based) remains in test.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  client:
    name: client (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      # Every action ref in every workflow is pinned to a full commit SHA
      # (SECURITY.md's claim); the same pins are used across ci/test/release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Typecheck
        working-directory: client
        run: npx tsc -b

      - name: Unit tests
        working-directory: client
        run: npx vitest run

  server:
    name: server (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same pinned action as test.yml and release.yml. uv installs exactly the
      # versions resolved in server/uv.lock — including the crocodile git
      # dependency that is not on PyPI and has no meaningful pip pin.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # --frozen: a lockfile that drifted from pyproject.toml fails the build
      # instead of being silently re-resolved. testpaths/timeout/asyncio config
      # come from server/pyproject.toml's [tool.pytest.ini_options].
      - name: Run tests
        working-directory: server
        run: uv sync --frozen && uv run pytest -q
