name: release

# Builds the self-contained FlowMap desktop installers for macOS (Apple Silicon
# + Intel), Windows (x64 + ARM64) and Linux, and attaches them to a GitHub
# Release.
#
# Native Python wheels (numpy / polars / msgspec / curl-cffi …) must be built on
# their own OS+arch, so each installer is produced on its matching runner — the
# bundled pyruntime cannot be cross-built. Triggered by pushing a `vX.Y.Z` tag;
# `workflow_dispatch` can dry-run the build (no upload) or (re)release an
# existing tag.
#
# Every released installer is signed with a SLSA build-provenance attestation
# and listed in a single `SHA256SUMS` asset, so a download can be tied back to
# this repo and this commit without trusting the release page — see SECURITY.md.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build & release (e.g. v1.2.0). Leave blank to build without releasing."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the target tag and whether we are releasing (vs. a dry-run build).
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      do_release: ${{ steps.resolve.outputs.do_release }}
    steps:
      - id: resolve
        # Untrusted github-context values are passed via env and only ever read
        # as quoted shell variables (never interpolated into the script body),
        # so a crafted tag/input cannot inject commands.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "do_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Ensure a (draft) Release exists for the tag before the matrix uploads to it.
  # ---------------------------------------------------------------------------
  release-draft:
    needs: prepare
    if: needs.prepare.outputs.do_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ensure a draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "FlowMap $TAG" --generate-notes --draft
          fi

  # ---------------------------------------------------------------------------
  # Build one installer per OS/arch and upload it to the draft release.
  # ---------------------------------------------------------------------------
  build:
    needs: [prepare, release-draft]
    # Run when releasing (release-draft succeeded) OR on a dry-run build
    # (release-draft skipped). Never run if prepare failed or the run cancelled.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.release-draft.result == 'success' || needs.release-draft.result == 'skipped') }}
    permissions:
      contents: write
      # An unsigned installer downloaded from a stranger's GitHub is, on its
      # face, indistinguishable from malware — "the source is open" says nothing
      # about the 168 MB binary, which nobody compiled themselves. These two
      # scopes let the run sign a provenance statement binding each installer's
      # digest to this repository, this workflow file and this commit, so the
      # link from readable source to downloaded binary stops being a promise:
      #   gh attestation verify FlowMap_<version>_aarch64.dmg -R nazmiefearmutcu/flowmap
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
            kind: macos
          # Intel macOS. NOT `macos-13`: that image was retired on 2025-12-04, so
          # jobs targeting it queue forever without ever being assigned a runner.
          # `macos-15-intel` is the x86_64 replacement (available until Aug 2027,
          # after which Actions drops Intel macOS entirely).
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            kind: macos
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            kind: windows
          # Windows on ARM (Snapdragon X laptops, Surface, and Windows 11 in a
          # VM on Apple Silicon). `windows-11-arm` is a GA GitHub-hosted ARM64
          # image, so this leg is a NATIVE build — no `--target` flag, and the
          # bundle lands in the same target/release/bundle path as every other
          # runner. An emulated x64 install works on these machines too, but it
          # runs an emulated CPython over an emulated webview; native is the
          # build we actually want people to download.
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            kind: windows
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            kind: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Uniform shell across all runners; on Windows this is Git-Bash, which
        # is what bundle-python.sh is written for.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust (host target ${{ matrix.triple }})
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.triple }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install Linux WebView + bundling deps
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            build-essential \
            fuse \
            libfuse2 \
            libgdk-pixbuf2.0-dev \
            gir1.2-gtk-3.0 \
            desktop-file-utils \
            squashfs-tools \
            zsync

      - name: Install Tauri CLI (cargo-tauri)
        run: cargo install tauri-cli --version "^2.0" --locked

      # --- macOS: the existing all-in-one script (client → pyruntime → tauri →
      #     ditto → ad-hoc codesign → dmg). Arch-aware, so it drives both the
      #     Apple-Silicon and Intel runners. ------------------------------------
      - name: Build macOS installer (build-dmg.sh)
        if: matrix.kind == 'macos'
        env:
          # Lets bundle-python.sh authenticate its python-build-standalone
          # release lookup; the unauthenticated GitHub API cap is 60/hour per IP
          # and shared runner IPs blow through it, returning a 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash app/scripts/build-dmg.sh

      # --- Windows/Linux: client + pyruntime + `cargo tauri build`. The
      #     pyruntime is embedded by Tauri via bundle.resources declared in
      #     tauri.<platform>.conf.json. ------------------------------------------
      - name: Build client (client/dist)
        if: matrix.kind != 'macos'
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Bundle Python runtime (${{ matrix.triple }})
        if: matrix.kind != 'macos'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash app/scripts/bundle-python.sh "${{ matrix.triple }}"

      - name: Generate Tauri icon set
        if: matrix.kind != 'macos'
        working-directory: app/src-tauri
        run: cargo tauri icon ../icons/icon-1024.png

      - name: Build Windows installers (cargo tauri build)
        if: matrix.kind == 'windows'
        working-directory: app/src-tauri
        run: cargo tauri build

      # The .deb is the SUPPORTED Linux installer and must succeed.
      - name: Build Linux .deb
        if: matrix.kind == 'linux'
        working-directory: app/src-tauri
        run: cargo tauri build --bundles deb

      # The AppImage is a best-effort portable EXTRA. linuxdeploy has to pack the
      # embedded ~500 MB CPython runtime into a squashfs image and fails on it
      # with an opaque "failed to run linuxdeploy" (Tauri swallows its stderr),
      # while the .deb from the same build is fine. Keeping this non-blocking
      # means a linuxdeploy problem can never hold back the whole release; the
      # upload step ships the AppImage only if it was actually produced.
      #   APPIMAGE_EXTRACT_AND_RUN — linuxdeploy and its plugins ARE AppImages
      #     and mount themselves via FUSE, which the runner cannot provide.
      #   NO_STRIP — linuxdeploy strips every bundled shared object; the CPython
      #     runtime has thousands and one unstrippable file aborts the bundle.
      - name: Build Linux AppImage (best-effort)
        if: matrix.kind == 'linux'
        continue-on-error: true
        working-directory: app/src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: cargo tauri build --bundles appimage

      # --- Per-OS smoke test: import every server dep from the BUNDLED
      #     interpreter, then boot the server and poll /api/health (mirrors the
      #     import check in bundle-python.sh and the health poll in main.rs). ----
      - name: Smoke test the bundled server
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = "windows" ]; then
            PY="app/src-tauri/resources/pyruntime/python.exe"
          else
            PY="app/src-tauri/resources/pyruntime/bin/python3.13"
          fi
          echo "interpreter: $PY"
          # The health poll below already proves everything the server imports
          # EAGERLY, so an eager-only list adds no coverage. What it cannot see
          # is the lazily-imported closure — above all the equity providers,
          # which are only reached on a real `equity:` subscribe. A bundle that
          # lost pandas or pyarrow would boot green and die on the first one.
          "$PY" -c "import importlib; [importlib.import_module(m) for m in ['flowmap_server','numpy','polars','fastapi','uvicorn','msgspec','crocodile','ccxt','aiohttp','certifi','crocodile.core.connector','crocodile.core.ingest.transport','crocodile.core.schema.records','crocodile.core.scheduler.calendar','crocodile.core.sink.memory','crocodile.crypto.exchanges.factory','crocodile.crypto.client.backfill','crocodile.crypto.exchanges.ccxt_universal.connector','crocodile.crypto.exchanges.binance.backfill','crocodile.equity.providers.factory','crocodile.equity.providers.yahoo.client','crocodile.equity.client.collect','crocodile.equity.depth.vap','pandas','pyarrow','yfinance','bs4']]; print('imports OK')"
          PORT=8799
          DATA_DIR="$(mktemp -d)"
          FLOWMAP_HOST=127.0.0.1 FLOWMAP_PORT="$PORT" FLOWMAP_RECORDING_ENABLED=0 FLOWMAP_DATA_DIR="$DATA_DIR" "$PY" -m flowmap_server &
          SRV=$!
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/api/health" 2>/dev/null | grep -q '"status":"ok"'; then
              echo "health OK"; ok=1; break
            fi
            sleep 1
          done
          kill "$SRV" 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "server health check FAILED"; exit 1; fi

      # The README's download table names every installer and its size, so those
      # numbers need a source that is not a guess. This prints what the leg
      # actually produced into the job summary — and because it runs on dry-run
      # builds too, the table can be refreshed BEFORE the tag is cut.
      - name: Report produced installers
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          B="app/src-tauri/target/release/bundle"
          {
            echo "### $TRIPLE"
            echo ""
            echo "| installer | size |"
            echo "|---|---|"
            find "$B" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
                                 -o -name '*.deb' -o -name '*.AppImage' \) -print0 \
              | while IFS= read -r -d '' f; do
                  printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
                done
          } >> "$GITHUB_STEP_SUMMARY"

      # One list, resolved once and reused by the attestation, the checksums and
      # the upload — so what gets signed, what gets hashed and what gets shipped
      # are the same files by construction, not by three globs agreeing.
      - name: Collect the produced installers
        id: installers
        if: needs.prepare.outputs.do_release == 'true'
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          B="app/src-tauri/target/release/bundle"
          case "$KIND" in
            macos)   FILES=$(ls "$B"/dmg/*.dmg) ;;
            windows) FILES=$(ls "$B"/msi/*.msi "$B"/nsis/*-setup.exe) ;;
            # The .deb is required; the AppImage is best-effort (see the build
            # step above), so glob it separately and tolerate its absence.
            linux)   FILES=$(ls "$B"/deb/*.deb; ls "$B"/appimage/*.AppImage 2>/dev/null || true) ;;
          esac
          echo "$FILES"
          # Multi-line step output: the delimiter must not occur in the payload,
          # and these are build-dir paths, so a literal marker is safe.
          { echo "files<<__FLOWMAP_EOF__"; echo "$FILES"; echo "__FLOWMAP_EOF__"; } >> "$GITHUB_OUTPUT"

      # Signs a SLSA provenance statement for every installer BEFORE it is
      # uploaded, so the digest in the attestation is the digest of the file the
      # next step ships. Sigstore-backed and public — anyone can check a download
      # against it without trusting the release page:
      #   gh attestation verify <file> -R nazmiefearmutcu/flowmap
      - name: Attest build provenance
        if: needs.prepare.outputs.do_release == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: ${{ steps.installers.outputs.files }}

      # Per-leg checksum lines. They are collected into a single SHA256SUMS asset
      # by the publish job — one file the whole release can be checked against,
      # which the parallel matrix cannot produce on its own.
      #   shasum first, not sha256sum: the macOS runners have no sha256sum. The
      #   fallback is not decoration — it keeps the leg alive if a runner image
      #   ever ships without perl, which is what shasum is.
      - name: Checksum the installers
        if: needs.prepare.outputs.do_release == 'true'
        env:
          FILES: ${{ steps.installers.outputs.files }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          sha256_of() {
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1" | cut -d' ' -f1
            else
              sha256sum "$1" | cut -d' ' -f1
            fi
          }
          mkdir -p checksums
          OUT="checksums/$TRIPLE.txt"
          : > "$OUT"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # `hash  basename` — the format `shasum -c` expects when it is run
            # next to the downloaded files, not next to this build tree.
            printf '%s  %s\n' "$(sha256_of "$f")" "$(basename "$f")" >> "$OUT"
          done <<< "$FILES"
          cat "$OUT"

      - name: Upload the checksum lines
        if: needs.prepare.outputs.do_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checksums-${{ matrix.triple }}
          path: checksums/${{ matrix.triple }}.txt
          if-no-files-found: error

      - name: Upload installers to the release
        if: needs.prepare.outputs.do_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          FILES: ${{ steps.installers.outputs.files }}
        run: |
          set -euo pipefail
          echo "uploading:"; echo "$FILES"
          # shellcheck disable=SC2086
          gh release upload "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------
  # Flip the release out of draft once every installer uploaded successfully.
  # ---------------------------------------------------------------------------
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.do_release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # download-artifact reads this run's own artifacts.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch the per-leg checksum lines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: checksums-*
          path: checksums

      # One SHA256SUMS for the whole release. The attestation is the strong
      # check (it proves *where* a file came from); this is the cheap one that
      # needs no tooling — `shasum -c SHA256SUMS` next to the downloads.
      # `find`, not a fixed glob: download-artifact's layout depends on whether
      # the artifacts were merged, and both shapes have to work.
      - name: Assemble and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          find checksums -name '*.txt' -exec cat {} + | sort -k2 > SHA256SUMS
          if [ ! -s SHA256SUMS ]; then echo "no checksum lines collected"; exit 1; fi
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" --draft=false --latest
