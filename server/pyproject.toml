[project]
name = "flowmap-server"
version = "1.4.0"
requires-python = ">=3.13"
dependencies = [
  # One engine for both markets. The `market` extra pulls ccxt, which is what
  # turns the crypto side from a hand-written venue list into the whole market:
  # `make_connector` falls through to the universal ccxt connector for any
  # exchange it has no native reader for.
  "crocodile[market]",
  # Imported directly by first-party code (the certifi-hardened REST sessions in
  # feeds/crypto.py, core/backfill.py and feeds/equity.py), not just inherited:
  # a transitive that the engine one day drops must not silently break us.
  "aiohttp>=3.9",
  "certifi",
  "msgspec>=0.18",
  "numpy>=1.26",
  "polars>=1.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2", "httpx>=0.27", "websockets>=12"]

[tool.uv.sources]
crocodile = { git = "https://github.com/nazmiefearmutcu/Crocodile.git", rev = "8ff6a75dcd61b673ccfc39465c746359c8444bce" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowmap_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
testpaths = ["tests"]
